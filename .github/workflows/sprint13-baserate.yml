name: Sprint 13 Adversarial Base Rate

on:
  push:
    branches:
      - s13-adversarial-base-rate
    paths:
      - 'lab/ground-truth/POL-S13-BASERATE-001.json'
      - 'lab/ground-truth/GT-S13-BASERATE-*.json'
      - 'scripts/run-sprint13-baserate.py'
      - 'scripts/verify-sprint13-baserate.py'
      - 'scripts/verify-sprint13-baserate.sh'
      - 'scripts/verify-sprint13-policy-registry-robustness.py'
      - 'docs/research/sprint-13-adversarial-base-rate-protocol.md'
      - '.github/workflows/sprint13-baserate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial-base-rate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Normalize Phase 4 scripts only
        run: chmod +x ./scripts/run-sprint13-baserate.py ./scripts/verify-sprint13-baserate.py ./scripts/verify-sprint13-baserate.sh ./scripts/verify-sprint13-policy-registry-robustness.py

      - name: Execute adversarial base-rate campaign
        run: bash ./scripts/verify-sprint13-baserate.sh

      - name: Compile product modules
        run: mvn --batch-mode --no-transfer-progress -Dmaven.test.skip=true package

      - name: Upload Phase 4 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acra-sprint-13-baserate
          path: |
            build/s13-baserate/**
          if-no-files-found: warn
