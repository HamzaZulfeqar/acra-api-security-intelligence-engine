name: Sprint 13 Cross Framework Development

on:
  push:
    branches:
      - s13-cross-framework-generalization
    paths:
      - 'scripts/sprint13_cross_framework_normalization.py'
      - 'scripts/run-sprint13-cross-framework-dev.py'
      - 'scripts/verify-sprint13-cross-framework-dev.py'
      - 'scripts/verify-sprint13-cross-framework-dev.sh'
      - 'lab/ground-truth/POL-S13-XFRAME-DEV-001.json'
      - 'lab/ground-truth/GT-S13-XFRAME-DEV-*.json'
      - '.github/workflows/sprint13-cross-framework-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xframe-development:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Normalize Phase 6A scripts
        run: chmod +x ./scripts/run-sprint13-cross-framework-dev.py ./scripts/verify-sprint13-cross-framework-dev.py ./scripts/verify-sprint13-cross-framework-dev.sh
      - name: Execute Phase 6A framework-shaped development campaign
        run: bash ./scripts/verify-sprint13-cross-framework-dev.sh
      - name: Compile product modules
        run: mvn --batch-mode --no-transfer-progress -Dmaven.test.skip=true package
      - name: Upload Phase 6A artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acra-sprint-13-xframe-dev
          path: build/s13-xframe-dev/**
          if-no-files-found: warn
