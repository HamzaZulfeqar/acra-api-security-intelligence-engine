name: Sprint 12 A0-A7 Research

on:
  push:
    branches:
      - s12-standalone-a0-a7-research-evaluation
    paths:
      - 'scripts/run-sprint12-ablation.py'
      - 'scripts/verify-sprint12-research.py'
      - 'scripts/verify-sprint12-research.sh'
      - 'lab/**'
      - 'docs/research/**'
      - 'docs/sprints/sprint-12.md'
      - 'docs/testing/TEST_MATRIX.md'
      - 'PROJECT_STATE.md'
      - 'CHANGELOG.md'
      - 'KNOWN_ISSUES.md'
      - '.github/workflows/sprint12-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Normalize scripts
        run: chmod +x ./scripts/*.sh ./scripts/*.py
      - name: Execute Sprint 12 controlled A0-A7 campaign
        run: bash ./scripts/verify-sprint12-research.sh
      - name: Compile product modules after research harness changes
        run: mvn --batch-mode --no-transfer-progress -Dmaven.test.skip=true package
      - name: Upload Sprint 12 measured artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acra-sprint-12-a0-a7-research
          path: |
            build/s12-research/EXP-A0-A7.json
            build/s12-research/EXP-A0-A7.json.sha256
            build/s12-research/EXP-A0-A7.csv
            build/s12-research/EXP-A0-A7.csv.sha256
            build/s12-research/EXP-A0-A7-cases.jsonl
            build/s12-research/EXP-A0-A7-cases.jsonl.sha256
            build/s11-ground-truth/verification.json
          if-no-files-found: warn
