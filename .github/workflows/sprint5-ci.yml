name: ACRA Sprint 5 CI

on:
  push:
    branches:
      - 'acra/s5-closure-s6-foundation'
    paths:
      - 'core/**'
      - 'scripts/**'
      - '.github/workflows/sprint5-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'core/**'
      - 'scripts/**'
      - '.github/workflows/sprint5-ci.yml'

permissions:
  contents: read

jobs:
  sprint5-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile core and tests warning-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/s5-ci
          mkdir -p build/s5-ci/main build/s5-ci/test
          find core/src/main/java -name '*.java' -type f | sort > build/s5-ci/main-sources.txt
          find core/src/test/java -name '*.java' -type f | sort > build/s5-ci/test-sources.txt
          javac --release 21 -Xlint:all -Werror -d build/s5-ci/main @build/s5-ci/main-sources.txt
          javac --release 21 -Xlint:all -Werror -cp build/s5-ci/main -d build/s5-ci/test @build/s5-ci/test-sources.txt

      - name: Run retained and Sprint 5 suites
        shell: bash
        run: |
          set -euo pipefail
          CP="build/s5-ci/main:build/s5-ci/test"
          suites=(
            io.acra.core.tests.TestSuite
            io.acra.core.tests.sprint3.Sprint3CoreTestSuite
            io.acra.core.tests.sprint4.Sprint4CoreVerificationTestSuite
            io.acra.core.tests.sprint4.Sprint4EngineSecurityTestSuite
            io.acra.core.tests.sprint4.Sprint4GraphIntegrationTestSuite
            io.acra.core.tests.sprint4.Sprint4ProductCompletionTestSuite
            io.acra.core.tests.sprint5.Sprint5AssessmentGuardTestSuite
            io.acra.core.tests.sprint5.Sprint5CorrelationSafetyTestSuite
            io.acra.core.tests.sprint5.Sprint5SerializationSecurityTestSuite
            io.acra.core.tests.sprint5.Sprint5EvidenceIntegrityTestSuite
            io.acra.core.tests.sprint5.Sprint5PolicyValidationTestSuite
            io.acra.core.tests.sprint5.Sprint5ContextNormalizationTestSuite
            io.acra.core.tests.sprint5.Sprint5AuthorizationDimensionTestSuite
            io.acra.core.tests.sprint5.Sprint5OrchestrationTestSuite
          )
          for suite in "${suites[@]}"; do
            echo "==> $suite"
            java -ea -cp "$CP" "$suite"
          done

      - name: Run controlled S5 localhost authorization validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/s5-ci
          ACRA_LAB_MODE=vulnerable PORT=18081 python3 lab/common/basic_api.py > build/s5-ci/lab-vulnerable.log 2>&1 &
          VULN_PID=$!
          ACRA_LAB_MODE=secure PORT=18082 python3 lab/common/basic_api.py > build/s5-ci/lab-secure.log 2>&1 &
          SECURE_PID=$!
          cleanup() {
            kill "$VULN_PID" "$SECURE_PID" 2>/dev/null || true
            wait "$VULN_PID" "$SECURE_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18081/health >/dev/null \
              && curl -fsS http://127.0.0.1:18082/health >/dev/null; then
              ready=1
              break
            fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            echo "ACRA-Lab did not become ready" >&2
            cat build/s5-ci/lab-vulnerable.log || true
            cat build/s5-ci/lab-secure.log || true
            exit 1
          fi
          java -ea -cp "build/s5-ci/main:build/s5-ci/test" \
            io.acra.core.tests.sprint4.Sprint5LocalhostAuthorizationIntegrationTestSuite
