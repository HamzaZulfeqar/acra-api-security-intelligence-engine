name: Sprint 13 Policy Uncertainty Governance Development

on:
  push:
    branches:
      - s13-policy-uncertainty-governance
    paths:
      - 'scripts/sprint13_uncertainty_governance.py'
      - 'scripts/run-sprint13-governance-dev.py'
      - 'scripts/verify-sprint13-governance-dev.py'
      - 'scripts/verify-sprint13-governance-dev.sh'
      - 'lab/ground-truth/POL-S13-GOV-DEV-001.json'
      - 'lab/ground-truth/GT-S13-GOV-DEV-*.json'
      - '.github/workflows/sprint13-governance-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-development:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Normalize Phase 5 development scripts
        run: chmod +x ./scripts/run-sprint13-governance-dev.py ./scripts/verify-sprint13-governance-dev.py ./scripts/verify-sprint13-governance-dev.sh
      - name: Execute Phase 5 governance development campaign
        run: bash ./scripts/verify-sprint13-governance-dev.sh
      - name: Compile product modules
        run: mvn --batch-mode --no-transfer-progress -Dmaven.test.skip=true package
      - name: Upload Phase 5 dev artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acra-sprint-13-governance-dev
          path: build/s13-gov-dev/**
          if-no-files-found: warn
