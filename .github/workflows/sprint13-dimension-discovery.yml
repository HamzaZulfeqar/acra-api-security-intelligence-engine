name: Sprint 13 Dimension Discovery

on:
  push:
    branches:
      - s13-dimension-discovery
    paths:
      - 'scripts/sprint13_dimension_inference.py'
      - 'scripts/run-sprint13-dimension-discovery.py'
      - 'scripts/verify-sprint13-dimension-discovery.py'
      - 'scripts/verify-sprint13-dimension-discovery.sh'
      - 'scripts/run-sprint12-ablation.py'
      - 'scripts/verify-sprint12-research.py'
      - 'lab/ground-truth/GT-S13-DIMENSION-*.json'
      - 'lab/ground-truth/GT-S13-HOLDOUT-*.json'
      - 'lab/heldout-api/**'
      - 'lab/vulnerable-api/basic-api/server.py'
      - 'docs/research/sprint-13-dimension-discovery-protocol.md'
      - 'docs/sprints/sprint-13.md'
      - '.github/workflows/sprint13-dimension-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dimension-discovery:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Normalize Phase 2 scripts only
        run: chmod +x ./scripts/run-sprint13-dimension-discovery.py ./scripts/verify-sprint13-dimension-discovery.py ./scripts/verify-sprint13-dimension-discovery.sh

      - name: Execute blind dimension-discovery campaign
        run: bash ./scripts/verify-sprint13-dimension-discovery.sh

      - name: Compile product modules after Phase 2 harness
        run: mvn --batch-mode --no-transfer-progress -Dmaven.test.skip=true package

      - name: Upload Sprint 13 Phase 2 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acra-sprint-13-dimension-discovery
          path: |
            build/s13-dimension-discovery/predictions.json
            build/s13-dimension-discovery/predictions.json.sha256
            build/s13-dimension-discovery/predictions.jsonl
            build/s13-dimension-discovery/predictions.jsonl.sha256
            build/s13-dimension-discovery/evaluation.json
            build/s13-dimension-discovery/evaluation.json.sha256
            build/s13-dimension-discovery/evaluation-cases.jsonl
            build/s13-dimension-discovery/evaluation-cases.jsonl.sha256
          if-no-files-found: warn
