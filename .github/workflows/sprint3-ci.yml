name: ACRA Sprint 3 CI

on:
  push:
    paths:
      - 'core/**'
      - 'extension/burp-extension/**'
      - 'tests/**'
      - 'lab/**'
      - 'experiments/**'
      - 'scripts/**'
      - 'pom.xml'
      - '.github/workflows/sprint3-ci.yml'
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install pinned Maven 3.9.16
        shell: bash
        run: |
          set -euo pipefail
          base="https://downloads.apache.org/maven/maven-3/3.9.16/binaries"
          curl -fsSLO "$base/apache-maven-3.9.16-bin.tar.gz"
          curl -fsSLO "$base/apache-maven-3.9.16-bin.tar.gz.sha512"
          echo "$(cat apache-maven-3.9.16-bin.tar.gz.sha512)  apache-maven-3.9.16-bin.tar.gz" | sha512sum -c -
          tar -xzf apache-maven-3.9.16-bin.tar.gz
          echo "$PWD/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"

      - name: Maven package with official Montoya dependency
        run: mvn --batch-mode --no-transfer-progress -Dmaven.test.skip=true package

      - name: Sprint 3 local verification gates
        run: ./scripts/verify-sprint3.sh

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acra-sprint3-verification
          path: |
            docs/testing/artifacts/verification-s3.txt
            docs/testing/artifacts/exp-recon-001-local-lab.txt
            docs/testing/artifacts/metrics-s3.txt
            docs/testing/artifacts/performance-baseline-s3.txt
            docs/testing/artifacts/environment-blocker-s3.txt
            extension/burp-extension/target/*.jar
          if-no-files-found: warn
