name: Sprint 13 Policy Uncertainty Governance Evaluation

on:
  push:
    branches:
      - s13-policy-uncertainty-governance
    paths:
      - 'lab/ground-truth/POL-S13-GOV-EVAL-001.json'
      - 'lab/ground-truth/GT-S13-GOV-EVAL-*.json'
      - 'scripts/run-sprint13-governance-eval.py'
      - 'scripts/verify-sprint13-governance-eval.py'
      - 'scripts/verify-sprint13-governance-eval.sh'
      - 'docs/research/sprint-13-policy-uncertainty-governance-protocol.md'
      - '.github/workflows/sprint13-governance-eval.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Normalize Phase 5 evaluation scripts
        run: chmod +x ./scripts/run-sprint13-governance-eval.py ./scripts/verify-sprint13-governance-eval.py ./scripts/verify-sprint13-governance-eval.sh
      - name: Execute Phase 5 untouched governance evaluation
        run: bash ./scripts/verify-sprint13-governance-eval.sh
      - name: Compile product modules
        run: mvn --batch-mode --no-transfer-progress -Dmaven.test.skip=true package
      - name: Upload Phase 5 evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acra-sprint-13-governance-eval
          path: build/s13-gov-eval/**
          if-no-files-found: warn
