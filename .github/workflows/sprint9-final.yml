name: Sprint 9 Final Closure

on:
  push:
    branches:
      - s9-property-authorization
    paths:
      - 'core/**'
      - 'extension/burp-extension/**'
      - 'lab/**'
      - 'tests/**'
      - 'scripts/verify-sprint9-final.sh'
      - 'scripts/verify-sprint9-foundation.sh'
      - 'scripts/package-sprint9.sh'
      - 'scripts/verify-sprint8-foundation.sh'
      - 'scripts/verify-sprint7-foundation.sh'
      - 'scripts/verify-sprint6-foundation.sh'
      - '.github/workflows/sprint9-final.yml'
      - 'pom.xml'
      - 'core/pom.xml'
      - 'extension/burp-extension/pom.xml'
      - 'docs/sprints/sprint-09-requirements-traceability.md'
      - 'docs/sprints/sprint-09-final-software-audit.md'
      - 'docs/sprints/sprint-09.md'
      - 'docs/testing/TEST_MATRIX.md'
      - 'PROJECT_STATE.md'
      - 'docs/sprints/ROADMAP.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Normalize scripts
        run: chmod +x ./scripts/*.sh
      - name: Run Sprint 9 final verification
        run: bash ./scripts/verify-sprint9-final.sh
      - name: Upload Sprint 9 final checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acra-sprint-09-final-checkpoint
          path: |
            build/s9-final-package/acra-sprint-09-final.zip
            build/s9-final-package/acra-sprint-09-final.zip.sha256
            build/s9-final-package/sprint9-package-manifest.txt
            build/s9-final-package/sprint9-package-verification.json
            build/s9-foundation/reporting/S9-PROPERTY-REPORT.json
            build/s9-foundation/reporting/S9-PROPERTY-REPORT.json.sha256
            build/s9-foundation/reporting/S9-PROPERTY-REPORT.md
            build/s9-foundation/performance/performance-s9.csv
            build/s9-foundation/*.log
          if-no-files-found: warn
