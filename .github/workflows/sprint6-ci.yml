name: Sprint 6 Verification

on:
  push:
    branches:
      - s6-tenant-rbac
    paths:
      - 'core/**'
      - 'lab/**'
      - 'scripts/verify-sprint6-foundation.sh'
      - '.github/workflows/sprint6-ci.yml'
      - 'docs/**'
      - 'PROJECT_STATE.md'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  sprint6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Normalize scripts
        run: chmod +x ./scripts/*.sh
      - name: Verify Sprint 6 foundation
        run: bash ./scripts/verify-sprint6-foundation.sh
