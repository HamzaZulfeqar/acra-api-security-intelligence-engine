name: Sprint 6 Verification

on:
  push:
    branches:
      - s6-tenant-rbac
    paths:
      - 'core/**'
      - 'extension/burp-extension/**'
      - 'lab/**'
      - 'scripts/verify-sprint6-foundation.sh'
      - '.github/workflows/sprint6-ci.yml'
      - 'docs/**'
      - 'PROJECT_STATE.md'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  sprint6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Normalize scripts
        run: chmod +x ./scripts/*.sh
      - name: Verify Sprint 6 foundation and live experiment
        run: bash ./scripts/verify-sprint6-foundation.sh
      - name: Compile Sprint 6 product UI
        run: mvn --batch-mode --no-transfer-progress -pl extension/burp-extension -am test-compile
      - name: Verify retained Sprint 4 UI
        run: java -ea -Djava.awt.headless=true -cp extension/burp-extension/target/test-classes:extension/burp-extension/target/classes:core/target/classes io.acra.burp.tests.sprint4.Sprint4UiTestSuite
      - name: Verify Sprint 6 authorization UI
        run: java -ea -Djava.awt.headless=true -cp extension/burp-extension/target/test-classes:extension/burp-extension/target/classes:core/target/classes io.acra.burp.tests.sprint6.Sprint6AuthorizationUiTestSuite
      - name: Upload Sprint 6 controlled experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint6-controlled-experiment
          path: |
            build/s6-foundation-ci/EXP-S6-TENANT-RBAC-001.json
            build/s6-foundation-ci/lab/*.log
            build/s6-foundation-ci/reporting/S6-AUTHORIZATION-REPORT.json
            build/s6-foundation-ci/reporting/S6-AUTHORIZATION-REPORT.json.sha256
            build/s6-foundation-ci/reporting/S6-AUTHORIZATION-REPORT.md
            build/s6-foundation-ci/performance/performance-s6.csv
          if-no-files-found: warn
