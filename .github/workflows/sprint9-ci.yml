name: Sprint 9 Property Authorization Verification

on:
  push:
    branches:
      - s9-property-authorization
    paths:
      - 'core/**'
      - 'extension/burp-extension/**'
      - 'lab/**'
      - 'scripts/verify-sprint9-foundation.sh'
      - '.github/workflows/sprint9-ci.yml'
      - 'docs/sprints/sprint-09.md'
      - 'docs/architecture/s9-property-authorization.md'
      - 'PROJECT_STATE.md'
      - 'docs/sprints/ROADMAP.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sprint9-property-authorization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Normalize scripts
        run: chmod +x ./scripts/*.sh
      - name: Verify Sprint 9 property authorization foundation
        run: bash ./scripts/verify-sprint9-foundation.sh
      - name: Verify Maven core test compilation
        run: mvn --batch-mode --no-transfer-progress -pl core test-compile
      - name: Compile Sprint 9 product UI
        run: mvn --batch-mode --no-transfer-progress -pl extension/burp-extension -am test-compile
      - name: Verify retained Sprint 4 UI
        run: java -ea -Djava.awt.headless=true -cp extension/burp-extension/target/test-classes:extension/burp-extension/target/classes:core/target/classes io.acra.burp.tests.sprint4.Sprint4UiTestSuite
      - name: Verify retained Sprint 6 authorization UI
        run: java -ea -Djava.awt.headless=true -cp extension/burp-extension/target/test-classes:extension/burp-extension/target/classes:core/target/classes io.acra.burp.tests.sprint6.Sprint6AuthorizationUiTestSuite
      - name: Verify retained Sprint 7 workflow UI
        run: java -ea -Djava.awt.headless=true -cp extension/burp-extension/target/test-classes:extension/burp-extension/target/classes:core/target/classes io.acra.burp.tests.sprint7.Sprint7WorkflowUiTestSuite
      - name: Verify retained Sprint 8 routing UI
        run: java -ea -Djava.awt.headless=true -cp extension/burp-extension/target/test-classes:extension/burp-extension/target/classes:core/target/classes io.acra.burp.tests.sprint8.Sprint8RoutingUiTestSuite
      - name: Verify Sprint 9 property UI
        run: java -ea -Djava.awt.headless=true -cp extension/burp-extension/target/test-classes:extension/burp-extension/target/classes:core/target/classes io.acra.burp.tests.sprint9.Sprint9PropertyUiTestSuite
      - name: Upload Sprint 9 performance observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint9-property-validation
          path: |
            build/s9-foundation/performance/performance-s9.csv
            build/s9-foundation/secure-lab.log
            build/s9-foundation/vulnerable-lab.log
          if-no-files-found: warn
