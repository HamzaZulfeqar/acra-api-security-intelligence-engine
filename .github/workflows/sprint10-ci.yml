name: Sprint 10 Batch Indirect Verification

on:
  push:
    branches:
      - s10-batch-indirect-authorization
    paths:
      - 'core/**'
      - 'scripts/verify-sprint10-foundation.sh'
      - '.github/workflows/sprint10-ci.yml'
      - 'docs/sprints/sprint-10.md'
      - 'docs/architecture/s10-batch-indirect-authorization.md'
      - 'PROJECT_STATE.md'
      - 'docs/sprints/ROADMAP.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sprint10-batch-indirect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Normalize scripts
        run: chmod +x ./scripts/*.sh
      - name: Verify Sprint 10 batch and indirect authorization foundation
        run: bash ./scripts/verify-sprint10-foundation.sh
      - name: Verify Maven core test compilation
        run: mvn --batch-mode --no-transfer-progress -pl core test-compile
