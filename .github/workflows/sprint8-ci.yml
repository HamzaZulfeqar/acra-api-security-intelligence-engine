name: Sprint 8 Routing Verification

on:
  push:
    branches:
      - s8-routing-normalization
    paths:
      - 'core/**'
      - 'scripts/verify-sprint8-foundation.sh'
      - '.github/workflows/sprint8-ci.yml'
      - 'docs/sprints/sprint-08.md'
      - 'docs/architecture/s8-routing-normalization.md'
      - 'PROJECT_STATE.md'
      - 'docs/sprints/ROADMAP.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sprint8-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Normalize scripts
        run: chmod +x ./scripts/*.sh
      - name: Verify Sprint 8 route normalization foundation
        run: bash ./scripts/verify-sprint8-foundation.sh
      - name: Verify retained Sprint 7 foundation
        run: bash ./scripts/verify-sprint7-foundation.sh
