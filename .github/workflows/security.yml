name: Security Checks

on:
  push:
    branches:
      - main
      - develop
      - s14-productization-release-hardening
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: '30 2 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  dependency-review:

    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        id: dependency_review
        continue-on-error: true
        uses: actions/dependency-review-action@v4

      - name: Record Dependency Review availability
        if: steps.dependency_review.outcome == 'failure'
        run: echo "DEPENDENCY_REVIEW_UNAVAILABLE — repository Dependency Graph is disabled; Sprint 15 local dependency contract remains blocking."

  codeql:

    name: CodeQL Analysis
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-extended

      - name: Build project
        run: mvn --batch-mode --no-transfer-progress clean compile -pl extension/burp-extension -am

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  secret-scan:

    name: Secret Scanning
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
