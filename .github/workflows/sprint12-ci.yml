name: Sprint 12 Reproduction Export Verification

on:
  push:
    branches:
      - s12-reproduction-export-interoperability
    paths:
      - 'core/**'
      - 'extension/burp-extension/**'
      - 'scripts/verify-sprint12-foundation.sh'
      - 'scripts/verify-sprint11-foundation.sh'
      - '.github/workflows/sprint12-ci.yml'
      - 'docs/sprints/sprint-12.md'
      - 'docs/architecture/s12-reproduction-export-interoperability.md'
      - 'docs/research/REQUIREMENTS.md'
      - 'PROJECT_STATE.md'
      - 'ROADMAP.md'
      - 'docs/sprints/ROADMAP.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sprint12-reproduction-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Normalize scripts
        run: chmod +x ./scripts/*.sh
      - name: Verify Sprint 12 reproduction export foundation
        run: bash ./scripts/verify-sprint12-foundation.sh
      - name: Verify Maven core test compilation
        run: mvn --batch-mode --no-transfer-progress -pl core test-compile
      - name: Verify official Montoya Burp adapter compilation
        run: mvn --batch-mode --no-transfer-progress -pl extension/burp-extension -am test-compile
