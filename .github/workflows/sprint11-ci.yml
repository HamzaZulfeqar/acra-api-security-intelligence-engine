name: Sprint 11 OAuth OIDC Verification

on:
  push:
    branches:
      - s11-oauth-oidc-intelligence
    paths:
      - 'core/**'
      - 'scripts/verify-sprint11-foundation.sh'
      - '.github/workflows/sprint11-ci.yml'
      - 'docs/sprints/sprint-11.md'
      - 'docs/architecture/s11-oauth-oidc-intelligence.md'
      - 'docs/adr/ADR-0012.md'
      - 'PROJECT_STATE.md'
      - 'docs/sprints/ROADMAP.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sprint11-oauth-oidc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Normalize scripts
        run: chmod +x ./scripts/*.sh
      - name: Verify Sprint 11 OAuth OIDC foundation
        run: bash ./scripts/verify-sprint11-foundation.sh
      - name: Verify Maven core test compilation
        run: mvn --batch-mode --no-transfer-progress -pl core test-compile
