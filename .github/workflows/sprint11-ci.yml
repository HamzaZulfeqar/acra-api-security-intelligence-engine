name: Sprint 11 Finding Lifecycle Verification

on:
  push:
    branches:
      - s11-finding-lifecycle-reproduction
    paths:
      - 'core/**'
      - 'extension/burp-extension/**'
      - 'scripts/verify-sprint11-foundation.sh'
      - '.github/workflows/sprint11-ci.yml'
      - 'docs/sprints/sprint-11.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sprint11-finding-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Normalize scripts
        run: chmod +x ./scripts/*.sh
      - name: Verify Sprint 11 finding lifecycle foundation
        run: bash ./scripts/verify-sprint11-foundation.sh
      - name: Verify Maven core test compilation
        run: mvn --batch-mode --no-transfer-progress -pl core test-compile
      - name: Compile retained product UI
        run: mvn --batch-mode --no-transfer-progress -pl extension/burp-extension -am test-compile
      - name: Verify retained Sprint 10 UI
        run: java -ea -Djava.awt.headless=true -cp extension/burp-extension/target/test-classes:extension/burp-extension/target/classes:core/target/classes io.acra.burp.tests.sprint10.Sprint10BatchIndirectUiTestSuite
      - name: Verify Sprint 11 read-only findings UI
        run: java -ea -Djava.awt.headless=true -cp extension/burp-extension/target/test-classes:extension/burp-extension/target/classes:core/target/classes io.acra.burp.tests.sprint11.Sprint11FindingReviewUiTestSuite
