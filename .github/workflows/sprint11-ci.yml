name: Sprint 11 Research Ablation Verification

on:
  push:
    branches:
      - s11-research-evaluation-ablation
    paths:
      - 'core/**'
      - 'lab/ground-truth/GT-S4-RESEARCH-FIXTURES.json'
      - 'lab/ground-truth/GT-S11-ABLATION-DATASET.json'
      - 'lab/ground-truth/GT-S11-EVIDENCE-READINESS.json'
      - 'lab/ground-truth/GT-EXEC-S4.json'
      - 'lab/common/basic_api.py'
      - 'core/src/test/java/io/acra/core/tests/sprint4/Sprint4LocalhostIntegrationTestSuite.java'
      - 'scripts/verify-sprint11-foundation.sh'
      - '.github/workflows/sprint11-ci.yml'
      - 'docs/sprints/sprint-11.md'
      - 'docs/architecture/s11-research-evaluation-ablation.md'
      - 'docs/research/EXPERIMENT_REGISTRY.md'
      - 'docs/research/EXPERIMENT_METHODOLOGY.md'
      - 'PROJECT_STATE.md'
      - 'ROADMAP.md'
      - 'docs/sprints/ROADMAP.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sprint11-research-ablation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Normalize scripts
        run: chmod +x ./scripts/*.sh
      - name: Verify Sprint 11 research ablation foundation
        run: bash ./scripts/verify-sprint11-foundation.sh
      - name: Verify Maven core test compilation
        run: mvn --batch-mode --no-transfer-progress -pl core test-compile
