name: Sprint 13 Cross Framework Runtime Evaluation

on:
  push:
    branches:
      - s13-cross-framework-runtime
    paths:
      - 'lab/framework-runtime-eval/**'
      - 'lab/ground-truth/POL-S13-XRUNTIME-EVAL-001.json'
      - 'lab/ground-truth/GT-S13-XRUNTIME-EVAL-*.json'
      - 'scripts/run-sprint13-cross-framework-runtime-eval.py'
      - 'scripts/verify-sprint13-cross-framework-runtime-eval.py'
      - 'scripts/verify-sprint13-cross-framework-runtime-eval.sh'
      - 'docs/research/sprint-13-cross-framework-runtime-protocol.md'
      - '.github/workflows/sprint13-cross-framework-runtime-eval.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install Python framework runtimes
        run: python -m pip install --disable-pip-version-check fastapi==0.115.12 uvicorn==0.34.2 Flask==3.1.0
      - name: Install Express evaluation runtime
        working-directory: lab/framework-runtime-eval/express
        run: npm install --no-audit --no-fund
      - name: Normalize Phase 6B evaluation scripts
        run: chmod +x ./scripts/run-sprint13-cross-framework-runtime-eval.py ./scripts/verify-sprint13-cross-framework-runtime-eval.py ./scripts/verify-sprint13-cross-framework-runtime-eval.sh
      - name: Execute untouched real local framework runtime evaluation
        run: bash ./scripts/verify-sprint13-cross-framework-runtime-eval.sh
      - name: Compile ACRA product modules
        run: mvn --batch-mode --no-transfer-progress -Dmaven.test.skip=true package
      - name: Upload Phase 6B evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acra-sprint-13-xruntime-eval
          path: build/s13-xruntime-eval/**
          if-no-files-found: warn
