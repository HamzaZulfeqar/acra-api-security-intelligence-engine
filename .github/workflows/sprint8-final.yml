name: Sprint 8 Final Closure

on:
  push:
    branches:
      - s8-routing-normalization
    paths:
      - 'core/**'
      - 'extension/burp-extension/**'
      - 'lab/**'
      - 'tests/**'
      - 'scripts/verify-sprint8-final.sh'
      - 'scripts/verify-sprint8-foundation.sh'
      - 'scripts/package-sprint8.sh'
      - 'scripts/verify-sprint7-foundation.sh'
      - 'scripts/verify-sprint6-foundation.sh'
      - '.github/workflows/sprint8-final.yml'
      - 'pom.xml'
      - 'core/pom.xml'
      - 'extension/burp-extension/pom.xml'
      - 'docs/sprints/sprint-08-requirements-traceability.md'
      - 'docs/sprints/sprint-08-final-software-audit.md'
      - 'docs/sprints/sprint-08.md'
      - 'docs/testing/TEST_MATRIX.md'
      - 'PROJECT_STATE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Normalize scripts
        run: chmod +x ./scripts/*.sh
      - name: Run Sprint 8 final verification
        run: bash ./scripts/verify-sprint8-final.sh
      - name: Upload Sprint 8 final checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acra-sprint-08-final-checkpoint
          path: |
            build/s8-final-package/acra-sprint-08-final.zip
            build/s8-final-package/acra-sprint-08-final.zip.sha256
            build/s8-final-package/sprint8-package-manifest.txt
            build/s8-final-package/sprint8-package-verification.json
            build/s8-foundation/reporting/S8-ROUTING-REPORT.json
            build/s8-foundation/reporting/S8-ROUTING-REPORT.json.sha256
            build/s8-foundation/reporting/S8-ROUTING-REPORT.md
            build/s8-foundation/performance/performance-s8.csv
            build/s8-foundation/lab/*.log
          if-no-files-found: warn
