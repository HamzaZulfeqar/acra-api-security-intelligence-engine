name: Sprint 12 Final Closure

on:
  push:
    branches:
      - s12-reproduction-standards-export
    paths:
      - 'core/**'
      - 'extension/burp-extension/**'
      - 'lab/**'
      - 'tests/**'
      - 'scripts/verify-sprint12-final.sh'
      - 'scripts/verify-sprint12-foundation.sh'
      - 'scripts/package-sprint12.sh'
      - 'scripts/verify-sprint11-foundation.sh'
      - 'scripts/verify-sprint10-foundation.sh'
      - 'scripts/verify-sprint9-foundation.sh'
      - 'scripts/verify-sprint8-foundation.sh'
      - 'scripts/verify-sprint7-foundation.sh'
      - 'scripts/verify-sprint6-foundation.sh'
      - '.github/workflows/sprint12-final.yml'
      - 'pom.xml'
      - 'core/pom.xml'
      - 'extension/burp-extension/pom.xml'
      - 'docs/sprints/sprint-12-requirements-traceability.md'
      - 'docs/sprints/sprint-12-final-software-audit.md'
      - 'docs/sprints/sprint-12.md'
      - 'docs/architecture/s12-reproduction-standards-export.md'
      - 'docs/research/REQUIREMENTS.md'
      - 'PROJECT_STATE.md'
      - 'ROADMAP.md'
      - 'docs/sprints/ROADMAP.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Normalize scripts
        run: chmod +x ./scripts/*.sh
      - name: Run Sprint 12 final verification
        run: bash ./scripts/verify-sprint12-final.sh
      - name: Upload Sprint 12 final checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acra-sprint-12-final-checkpoint
          path: |
            build/s12-final-package/acra-sprint-12-final.zip
            build/s12-final-package/acra-sprint-12-final.zip.sha256
            build/s12-final-package/sprint12-package-manifest.txt
            build/s12-final-package/sprint12-package-verification.json
            build/s12-foundation/reproduction/s12-reproduction.json
            build/s12-foundation/reproduction/s12-reproduction.json.sha256
            build/s12-foundation/reproduction/s12-reproduction.sarif
            build/s12-foundation/reproduction/s12-reproduction.sarif.sha256
          if-no-files-found: warn
